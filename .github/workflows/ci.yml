name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-api
    # A real Postgres for the migration, session, quota and account integration tests.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: summarizer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d summarizer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DSN: host=localhost port=5432 user=user password=password dbname=summarizer_test sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # An exact patch release: 1.27.2 fixes eleven standard-library vulnerabilities that 1.27.1 has, and
          # the "1.27" shorthand still resolved to 1.27.1 (the action's list of versions lags go.dev). Raise it when govulncheck says so.
          go-version: "1.27.2"
          cache-dependency-path: go-api/go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: go-api
      # -race catches data races in the limiters, sessions and quota code.
      - run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage
        run: |
          echo "### Go coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # Fails on known vulnerabilities that the code actually reaches (standard library included).
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  python-ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-ai-service/requirements*.txt
      # The tests that read a scanned page for real need the Tesseract program, with English.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: pytest -q --cov --cov-report=term --cov-report=xml
      - name: Coverage
        run: |
          echo "### Python coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
      # Production dependencies only: what ships to users. Dev-tool advisories are tracked separately.
      - run: pnpm audit --prod --audit-level=high

  # The repository's own housekeeping: the API description matches the real routes, the git hooks behave, and the
  # changelog can still be built from the history.
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog reads the whole history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install openapi-spec-validator==0.9.0 pyyaml==6.0.3
      - run: python scripts/validate_openapi.py
      - run: sh scripts/test-hooks.sh
      - run: bash -n scripts/backup-db.sh && bash -n scripts/restore-check.sh
      - name: Build the changelog
        run: |
          python scripts/changelog.py -o "$RUNNER_TEMP/CHANGELOG.md"
          grep -q "^### Added" "$RUNNER_TEMP/CHANGELOG.md"

  # The browser extension has no build step and no dependencies: its own tests run on plain Node, and the store packages are
  # built (and kept for two weeks) so what is uploaded is exactly what was tested. Its tests in a real Chromium are in the
  # e2e job below; here it is also loaded into a real Firefox (the runner has Firefox and its driver) and checked against
  # Mozilla's own rules for add-ons.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: node --test "extension/test/*.test.mjs"
      - name: Build the packages
        run: |
          python scripts/package_extension.py -o "$RUNNER_TEMP/inkling-extension.zip"
          python scripts/package_extension.py --firefox -o "$RUNNER_TEMP/inkling-extension-firefox.zip"
          python scripts/package_extension.py --firefox --unpacked "$RUNNER_TEMP/firefox"
      - name: Check the Firefox build against Mozilla's rules
        run: npx --yes web-ext@10.7.0 lint -s "$RUNNER_TEMP/firefox" --warnings-as-errors
      # The extended-support release, not the newest Firefox: from Firefox 157 on, the test tool is no longer allowed to run
      # scripts inside a page of an add-on ("does not support browsing contexts in privileged scope"), and the test needs
      # that to find the page's tab. That is a limit of the tool, not of the extension, which also has to work on 140.
      - uses: browser-actions/setup-firefox@v1
        id: esr
        with:
          firefox-version: latest-esr
      - name: Load it into a real Firefox and use it
        env:
          # The runner already has a newer Firefox first on its path: say which one to use.
          FIREFOX_BIN: ${{ steps.esr.outputs.firefox-path }}
        run: |
          pip install selenium==4.51.0
          "$FIREFOX_BIN" --version
          # The output is kept, and when the test fails its end is also written as an annotation of the run, where it can be read
          # without opening the log.
          if ! python extension/test/firefox/run_firefox_test.py > "$RUNNER_TEMP/firefox-test.log" 2>&1; then
            cat "$RUNNER_TEMP/firefox-test.log"
            detail=$(tail -c 3500 "$RUNNER_TEMP/firefox-test.log" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=The Firefox test failed::$detail"
            exit 1
          fi
          cat "$RUNNER_TEMP/firefox-test.log"
      - uses: actions/upload-artifact@v7
        with:
          name: inkling-extension
          path: |
            ${{ runner.temp }}/inkling-extension.zip
            ${{ runner.temp }}/inkling-extension-firefox.zip
          retention-days: 14

  # The whole stack in a real browser: Postgres, the Go API, the production Next build and a stub
  # standing in for the AI service (so the run is fast, free and deterministic).
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: summarizer_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d summarizer_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DSN: host=localhost port=5432 user=user password=password dbname=summarizer_e2e sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # An exact patch release: 1.27.2 fixes eleven standard-library vulnerabilities that 1.27.1 has, and
          # the "1.27" shorthand still resolved to 1.27.1 (the action's list of versions lags go.dev). Raise it when govulncheck says so.
          go-version: "1.27.2"
          cache-dependency-path: go-api/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/e2e/.tmp/api.log
          retention-days: 7
