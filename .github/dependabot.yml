version: 2

# Weekly update PRs, grouped so a routine bump is one PR per ecosystem rather than a dozen.
updates:
  - package-ecosystem: gomod
    directory: /go-api
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /python-ai-service
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    # Pillow 13 cannot be installed together with fastembed (it asks for Pillow below 13); see the pip-audit step in ci.yml.
    ignore:
      - dependency-name: pillow
        versions: [">=13"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /go-api
      - /python-ai-service
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
