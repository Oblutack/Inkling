services:
  postgres:
    image: postgres:15-alpine
    container_name: summarizer-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-summarizer_db}
    ports:
      - "127.0.0.1:5433:5432"  # localhost only: never expose the database to the network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  python-ai-service:
    container_name: python-ai-service
    build:
      context: ./python-ai-service
    ports:
      - "127.0.0.1:8001:10000"  # localhost only: the AI service is for the Go API, not the network
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      # Optional shared secret with the Go API (same value on both). Needed when the AI service is
      # reachable from the internet; unnecessary on this private compose network.
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      # Searching documents by meaning runs a small model inside this service. EMBEDDINGS=off turns it
      # off (search is then by keyword only). A larger EMBEDDING_MODEL finds more but needs more memory.
      - EMBEDDINGS=${EMBEDDINGS:-on}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_MIN_SCORE=${EMBEDDING_MIN_SCORE:-}
    restart: unless-stopped

  go-api:
    container_name: go-api
    build:
      context: ./go-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      python-ai-service:
        condition: service_healthy
    environment:
      - DSN=host=postgres user=${POSTGRES_USER:-user} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-summarizer_db} port=5432 sslmode=disable
      # Optional: a separate connection (the database owner) used only to apply migrations at start-up, so DSN above can
      # be a limited account. See docs/least-privilege.sql.
      - MIGRATE_DSN=${MIGRATE_DSN:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      - AI_SERVICE_URL=http://python-ai-service:10000
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      # Alerts to the owner by email (see .env.example): many people at once, the AI budget used up, the AI service failing.
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      - ALERT_ACTIVE_USERS=${ALERT_ACTIVE_USERS:-10}
      - ALERT_ACTIVE_USERS_HIGH=${ALERT_ACTIVE_USERS_HIGH:-25}
      - ALERT_WINDOW_MINUTES=${ALERT_WINDOW_MINUTES:-5}
      - ALERT_COOLDOWN_MINUTES=${ALERT_COOLDOWN_MINUTES:-60}
      # Sessions: plain-http local development needs non-Secure cookies. In production use
      # COOKIE_SECURE=true, and COOKIE_SAMESITE=none when the frontend and API are on different sites.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      # Email: "log" prints links to the server log; brevo and resend send real mail.
      - MAIL_PROVIDER=${MAIL_PROVIDER:-log}
      - MAIL_FROM=${MAIL_FROM:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - REQUIRE_EMAIL_VERIFICATION=${REQUIRE_EMAIL_VERIFICATION:-false}
      # Two-step sign-in: the key that protects authenticator secrets in the database (openssl rand -base64 32). Empty: off.
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-}
      # Abuse protection. Empty TURNSTILE_SECRET turns the human check off.
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      - QUOTA_SUMMARIES_PER_DAY=${QUOTA_SUMMARIES_PER_DAY:-50}
      - QUOTA_CHAT_PER_DAY=${QUOTA_CHAT_PER_DAY:-200}
      # Spending guard: a visitor's summaries a day without an account, and the AI work the whole site starts a day.
      - ANON_SUMMARIES_PER_DAY=${ANON_SUMMARIES_PER_DAY:-10}
      - AI_REQUESTS_PER_DAY=${AI_REQUESTS_PER_DAY:-5000}
      # Multiplies every request rate limit (default 1).
      - RATE_LIMIT_MULTIPLIER=${RATE_LIMIT_MULTIPLIER:-1}
      # How much original PDF data each user may keep for the document viewer (0 = keep none).
      - STORED_FILES_MB_PER_USER=${STORED_FILES_MB_PER_USER:-100}
    restart: unless-stopped

volumes:
  postgres_data:
