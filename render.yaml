# Render Blueprint: the Go API, the AI service and a Postgres database.
# See docs/DEPLOYMENT.md for the full walkthrough (this file alone is not enough: a few values
# marked "sync: false" are asked for when you apply the Blueprint, and the frontend lives on Vercel).
#
# Free-tier notes: free web services sleep after 15 minutes without traffic (the first request then
# waits ~30-60 seconds), and Render's free Postgres is deleted after 30 days. For anything you want to
# keep, use a paid database or an external one (for example Neon) and set DSN yourself.

databases:
  - name: inkling-db
    plan: free
    region: frankfurt
    databaseName: inkling
    user: inkling
    ipAllowList: [] # reachable only from Render services, not from the internet

services:
  # The AI service is public on free plans, so it is protected by a shared secret (AI_SERVICE_TOKEN).
  - type: web
    name: inkling-ai
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./python-ai-service/Dockerfile
    dockerContext: ./python-ai-service
    healthCheckPath: /healthz
    envVars:
      - key: GROQ_API_KEY
        sync: false # your Groq key, asked for when you apply the Blueprint
      - key: AI_SERVICE_TOKEN
        generateValue: true # copy the generated value into inkling-api (see the guide)
      - key: LOG_FORMAT
        value: json
      # Searching documents by meaning needs about 300 MB of memory for the model, which is too close to the
      # 512 MB of a free instance. Switch it on (value: "on") on a plan with 1 GB or more. Until then search is by keyword.
      - key: EMBEDDINGS
        value: "off"
      - key: SENTRY_DSN
        sync: false # optional; leave empty to disable error reporting
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: METRICS_TOKEN
        sync: false # optional; leave empty to keep /metrics switched off

  - type: web
    name: inkling-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./go-api/Dockerfile
    dockerContext: ./go-api
    healthCheckPath: /healthz
    envVars:
      - key: DSN
        fromDatabase:
          name: inkling-db
          property: connectionString
      # Optional, for a limited database account (docs/least-privilege.sql): DSN becomes that account and this the owner.
      - key: MIGRATE_DSN
        sync: false
      - key: AI_SERVICE_URL
        sync: false # https://<inkling-ai's address>.onrender.com, shown on its Render page
      - key: AI_SERVICE_TOKEN
        sync: false # the value Render generated for inkling-ai
      - key: GOOGLE_CLIENT_ID
        sync: false
      # The frontend (on Vercel) and this API are on different sites, so the session cookie must be
      # Secure and SameSite=None. Putting both under one domain is better; see the guide.
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: CORS_ALLOWED_ORIGINS
        sync: false # your frontend's address, e.g. https://inkling.vercel.app
      - key: FRONTEND_URL
        sync: false # same address: used for the links in emails
      - key: MAIL_PROVIDER
        value: log # change to brevo or resend once you have an account (see the guide)
      - key: MAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TRUSTED_PROXIES
        sync: false # see the guide: without it every visitor looks like Render's proxy and shares the IP-based limits
      - key: TURNSTILE_SECRET
        sync: false # optional
      - key: TOTP_ENCRYPTION_KEY
        sync: false # optional: turns on two-step sign-in (an authenticator app). `openssl rand -base64 32`; keep it, do not change it
      - key: LOG_FORMAT
        value: json
      # Original PDFs live in the database, which is small on free plans: keep the per-user cap low there.
      - key: STORED_FILES_MB_PER_USER
        value: "20"
      - key: SENTRY_DSN
        sync: false # optional
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: METRICS_TOKEN
        sync: false # optional
      - key: ALERT_EMAIL
        sync: false # optional; where alerts (many people at once, AI budget used up, AI service failing) are emailed
      # Scheduled work (the daily flashcard reminder and the checks of watched pages). A free Render web service sleeps, and a
      # sleeping service runs no jobs.
      - key: JOBS_ENABLED
        value: "true"
      # Watched pages (see .env.example); the defaults suit most sites.
      - key: WATCHES_PER_USER
        value: "10"
      - key: WATCH_MIN_HOURS
        value: "12"
