openapi: 3.1.0
info:
  title: Inkling API
  version: "1.2.0"
  summary: Summarize text, web pages, documents, photos and recordings from your own programs.
  description: |
    The API for programs. Create a key on the **Account** page, then send it with every request:

    ```
    Authorization: Bearer ink_...
    ```

    **What a key can do.** Summarize, explain a few selected words, add a page or text to your reading list, and read today's usage. Nothing else: it
    cannot read or change your saved summaries, your reading list, your account or your other keys, so a leaked key can
    be revoked without harm to anything else. Nothing a key summarizes is saved to your library or kept, except what it
    adds to the reading list (a short summary of the page, kept in your library with it) and what `save=true` asks for.

    **Whose allowance.** Calls count against the key owner's daily limits (the same as the website) and the site's own
    rate limits. Every response carries `X-Quota-Limit` and `X-Quota-Remaining`. Work that fails because of Inkling
    (a `5xx`) is not counted. A key can also be given a **daily limit of its own** and an **expiry date** when it is made;
    a key past its limit gets `429` with `code: api_key_limit`, and one that has expired `401` with
    `code: api_key_expired`. `GET /v1/usage` shows what the key has done today and in all.

    **Keeping results.** Nothing is saved by default. Add `?save=true` to a summarize call to put the result in the key
    owner's library; the reply (or the final `done` event of a stream) then carries the saved document's `id`.

    **For servers only.** Call the API from your own server, never from a web page: a key in a page is a key anyone
    can read, and browsers from other sites are refused. The one exception is a browser extension (such as the one in
    `extension/` of the repository): the browser sets its origin and a web page cannot forge it, so it may call the
    `/v1` routes with a key.

    **Streaming.** Add `?stream=true` to a summarize call to receive server-sent events instead of one reply: lines of
    `data: {json}` where `type` is `status` (progress), `delta` (a piece of the summary, in `text`), `done` or `error`.
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: A local development stack
security:
  - ApiKey: []
tags:
  - name: Summaries
    description: What a key is for.
  - name: Keys
    description: Making and ending keys. These need a signed-in browser session, never a key.
paths:
  /v1/summarize-text:
    post:
      tags: [Summaries]
      operationId: summarizeText
      summary: Summarize text
      parameters:
        - $ref: "#/components/parameters/wordCount"
        - $ref: "#/components/parameters/pageLimit"
        - $ref: "#/components/parameters/style"
        - $ref: "#/components/parameters/language"
        - $ref: "#/components/parameters/stream"
        - $ref: "#/components/parameters/save"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 200000
            example:
              text: Heat pumps move heat instead of making it. Sales rose in 2024.
      responses:
        "200":
          $ref: "#/components/responses/Summary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidKey"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          $ref: "#/components/responses/OverLimit"
        "502":
          $ref: "#/components/responses/AiFailed"
        "503":
          $ref: "#/components/responses/Paused"
  /v1/summarize-url:
    post:
      tags: [Summaries]
      operationId: summarizeUrl
      summary: Summarize a web page (or a link straight to a PDF)
      description: |
        Inkling fetches the page itself. Only public `http` and `https` addresses work; addresses that lead to a
        private network are refused. Pages that need JavaScript or a login cannot be read.
      parameters:
        - $ref: "#/components/parameters/wordCount"
        - $ref: "#/components/parameters/pageLimit"
        - $ref: "#/components/parameters/style"
        - $ref: "#/components/parameters/language"
        - $ref: "#/components/parameters/stream"
        - $ref: "#/components/parameters/save"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
            example:
              url: https://example.com/article
      responses:
        "200":
          $ref: "#/components/responses/Summary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidKey"
        "422":
          $ref: "#/components/responses/Unreadable"
        "429":
          $ref: "#/components/responses/OverLimit"
        "502":
          $ref: "#/components/responses/AiFailed"
        "503":
          $ref: "#/components/responses/Paused"
  /v1/explain:
    post:
      tags: [Summaries]
      operationId: explain
      summary: Explain a few selected words in plain words
      description: |
        What the browser extension's "Explain this" asks for: a few selected words or sentences (up to 2000 characters)
        explained in two to four short sentences, or, with `simpler`, in everyday words. Nothing is saved. It counts as one
        chat question of the key owner's daily allowance (not a summary), and is refunded if it fails. The explanation is the
        AI's, and can be wrong.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 2000
                simpler:
                  type: boolean
                  default: false
                language:
                  $ref: "#/components/schemas/Language"
            example:
              text: The deposit is held in escrow until the lease ends.
      responses:
        "200":
          description: The explanation.
          headers:
            X-Quota-Limit:
              $ref: "#/components/headers/QuotaLimit"
            X-Quota-Remaining:
              $ref: "#/components/headers/QuotaRemaining"
          content:
            application/json:
              schema:
                type: object
                required: [explanation]
                properties:
                  explanation:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidKey"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          $ref: "#/components/responses/OverLimit"
        "502":
          $ref: "#/components/responses/AiFailed"
        "503":
          $ref: "#/components/responses/Paused"
  /v1/reading-list:
    post:
      tags: [Summaries]
      operationId: saveForLater
      summary: Save a page or a text to your reading list
      description: |
        Inkling reads the page (or takes the text) now, keeps a short summary of it in the key owner's library and puts it on
        their reading list, to be read later. Send either `url` or `text`. A page that is on the list already is not
        summarized again: the reply is `200` with `alreadySaved: true`, and nothing is counted. A new one counts as one
        summary of the owner's allowance. A list holds up to 500 items (`409` when it is full). The summary is written
        in `language` (default English), in the style of a few lines; the style and length cannot be changed.
      parameters:
        - $ref: "#/components/parameters/language"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                text:
                  type: string
                  maxLength: 200000
              oneOf:
                - required: [url]
                - required: [text]
            example:
              url: https://example.com/article
      responses:
        "200":
          description: The page was on the list already.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedItem"
        "201":
          description: Saved.
          headers:
            X-Quota-Limit:
              $ref: "#/components/headers/QuotaLimit"
            X-Quota-Remaining:
              $ref: "#/components/headers/QuotaRemaining"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidKey"
        "409":
          description: The reading list is full (500 items); `error` says so.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unreadable"
        "429":
          $ref: "#/components/responses/OverLimit"
        "502":
          $ref: "#/components/responses/AiFailed"
        "503":
          $ref: "#/components/responses/Paused"
  /v1/summarize:
    post:
      tags: [Summaries]
      operationId: summarizeFile
      summary: Summarize one file
      description: |
        A PDF, Word (`.docx`), PowerPoint (`.pptx`), photo of a page (`.jpg`, `.jpeg`, `.png`, `.webp`, `.heic`, `.heif`) or recording
        (`.mp3`, `.m4a`, `.wav`, `.ogg`, `.flac`, `.webm`, `.mp4`). Scanned PDFs and photos are read with OCR;
        recordings are transcribed first. Documents and photos can be up to 10 MB, recordings up to 25 MB.
      parameters:
        - $ref: "#/components/parameters/stream"
        - $ref: "#/components/parameters/save"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                wordCount:
                  type: integer
                  minimum: 50
                  maximum: 1000
                  default: 150
                pageLimit:
                  type: integer
                  minimum: 0
                  maximum: 20
                  default: 0
                style:
                  $ref: "#/components/schemas/Style"
                language:
                  $ref: "#/components/schemas/Language"
      responses:
        "200":
          $ref: "#/components/responses/Summary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidKey"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/Unreadable"
        "429":
          $ref: "#/components/responses/OverLimit"
        "502":
          $ref: "#/components/responses/AiFailed"
        "503":
          $ref: "#/components/responses/Paused"
  /v1/summarize-multiple:
    post:
      tags: [Summaries]
      operationId: summarizeFiles
      summary: Summarize up to five files together
      description: |
        One combined summary that calls out overlaps and differences. Several photos in one call are the pages of one
        document, in the order sent, and are summarized as one document.
      parameters:
        - $ref: "#/components/parameters/stream"
        - $ref: "#/components/parameters/save"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    format: binary
                wordCount:
                  type: integer
                  minimum: 50
                  maximum: 1000
                  default: 150
                pageLimit:
                  type: integer
                  minimum: 0
                  maximum: 20
                  default: 0
                style:
                  $ref: "#/components/schemas/Style"
                language:
                  $ref: "#/components/schemas/Language"
      responses:
        "200":
          $ref: "#/components/responses/Summary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidKey"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/Unreadable"
        "429":
          $ref: "#/components/responses/OverLimit"
        "502":
          $ref: "#/components/responses/AiFailed"
        "503":
          $ref: "#/components/responses/Paused"
  /v1/compare:
    post:
      tags: [Summaries]
      operationId: compareTexts
      summary: What changed between two versions of a text
      description: |
        The differences are found by a program that matches the two texts sentence by sentence, so every `before` and
        `after` is the exact text of one of yours; capital letters, spacing and punctuation are not changes, and a
        passage that only moved is reported as moved. The language model only explains each change in a sentence and
        rates how much it could matter. An explanation that mentions a number that is in neither version is dropped and
        replaced by a plain description. A change whose text reads like an instruction to an AI is flagged
        (`suspicious`) and always rated `high`. Costs one request of the allowance. Each text can be up to 300,000
        characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old, new]
              properties:
                old:
                  $ref: "#/components/schemas/NamedText"
                new:
                  $ref: "#/components/schemas/NamedText"
                language:
                  $ref: "#/components/schemas/Language"
            example:
              old:
                name: Contract v1
                text: Payment is due within 30 days of the invoice.
              new:
                name: Contract v2
                text: Payment is due within 60 days of the invoice.
      responses:
        "200":
          description: The comparison.
          headers:
            X-Quota-Limit:
              $ref: "#/components/headers/QuotaLimit"
            X-Quota-Remaining:
              $ref: "#/components/headers/QuotaRemaining"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comparison"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidKey"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          $ref: "#/components/responses/OverLimit"
        "502":
          $ref: "#/components/responses/AiFailed"
        "503":
          $ref: "#/components/responses/Paused"
  /v1/extract:
    post:
      tags: [Summaries]
      operationId: extractFields
      summary: Named fields read out of a text, each with its exact quote
      description: |
        Up to 20 fields (each text, number, date, amount or list). For every field the reply has the value and the exact
        quote it was read from, and a program has checked both: the quote must be in the text (its page is found) and the
        value must be in the quote (numbers are compared as numbers). `verified: false` says the value could not be
        confirmed, and `reason` why, for example a number the model added up itself. A field the text does not state has
        `found: false`. If the text contains sentences written for an AI ("ignore your instructions..."), a quote taken
        from one is never `verified` and `suspicious` is true. Costs one request of the allowance. The text can be up to
        400,000 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, fields]
              properties:
                name:
                  type: string
                  maxLength: 200
                text:
                  type: string
                  maxLength: 400000
                fields:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    $ref: "#/components/schemas/FieldSpec"
                language:
                  $ref: "#/components/schemas/Language"
            example:
              name: invoice.txt
              text: "Invoice number: INV-42. Total amount due: 1,020.00 euros."
              fields:
                - name: Invoice number
                - name: Total
                  type: amount
      responses:
        "200":
          description: One result per field, in the order asked.
          headers:
            X-Quota-Limit:
              $ref: "#/components/headers/QuotaLimit"
            X-Quota-Remaining:
              $ref: "#/components/headers/QuotaRemaining"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extraction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidKey"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          $ref: "#/components/responses/OverLimit"
        "502":
          $ref: "#/components/responses/AiFailed"
        "503":
          $ref: "#/components/responses/Paused"
  /v1/usage:
    get:
      tags: [Summaries]
      operationId: usage
      summary: Today's usage of the key owner's daily allowance, and of this key
      responses:
        "200":
          description: Used and allowed today (UTC), what this key has done, and when the day resets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  summaries:
                    $ref: "#/components/schemas/Meter"
                  chats:
                    $ref: "#/components/schemas/Meter"
                  key:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      usedToday:
                        type: integer
                      usedTotal:
                        type: integer
                      dailyLimit:
                        type: [integer, "null"]
                      expiresAt:
                        type: [string, "null"]
                        format: date-time
                  resetsAt:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/InvalidKey"
  /account/api-keys:
    get:
      tags: [Keys]
      operationId: listKeys
      summary: List your keys (never the keys themselves)
      security:
        - Session: []
      responses:
        "200":
          description: Newest first, live and revoked.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeyInfo"
        "401":
          description: Not signed in.
    post:
      tags: [Keys]
      operationId: createKey
      summary: Make a key
      description: |
        The key is in this reply and nowhere else. Only a hash is kept, so a lost key cannot be shown again, only
        revoked and replaced. At most five live keys per person.
      security:
        - Session: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 40
                  description: Optional, to tell keys apart. Defaults to "API key".
                expiresInDays:
                  type: integer
                  minimum: 0
                  maximum: 366
                  description: The key stops working after this many days. 0 or absent means never.
                dailyLimit:
                  type: integer
                  minimum: 1
                  maximum: 1000000
                  description: |
                    The most requests this key may make in a day (UTC), on top of its owner's allowance. Absent means
                    only the owner's allowance limits it.
      responses:
        "201":
          description: The new key.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/KeyInfo"
                  - type: object
                    properties:
                      key:
                        type: string
                        example: ink_AbCd1234...
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Not signed in.
        "409":
          description: 'Five live keys already (`code: too_many_api_keys`).'
  /account/api-keys/{id}:
    delete:
      tags: [Keys]
      operationId: revokeKey
      summary: End a key at once
      security:
        - Session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The key no longer works.
        "401":
          description: Not signed in.
        "404":
          description: No such live key of yours.
components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      description: An API key, `ink_...`, made on the Account page.
    Session:
      type: apiKey
      in: cookie
      name: session
      description: The browser session of a signed-in person (the website uses this).
  parameters:
    wordCount:
      name: wordCount
      in: query
      schema:
        type: integer
        minimum: 50
        maximum: 1000
        default: 150
      description: About how many words the summary should have.
    pageLimit:
      name: pageLimit
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 20
        default: 0
      description: Fit the summary into this many pages (0 for no page limit).
    style:
      name: style
      in: query
      schema:
        $ref: "#/components/schemas/Style"
    language:
      name: language
      in: query
      schema:
        $ref: "#/components/schemas/Language"
    save:
      name: save
      in: query
      schema:
        type: boolean
        default: false
      description: Keep the result in the key owner's library; the reply then has the saved document's `id`.
    stream:
      name: stream
      in: query
      schema:
        type: boolean
        default: false
      description: Receive server-sent events as the summary is written, instead of one reply.
  schemas:
    Style:
      type: string
      enum: [default, bullets, brief, simple, takeaways, glance]
      default: default
      description: |
        `brief` is an executive brief (an overview, key points and implications); `glance` is one plain paragraph of two or
        three sentences.
    Language:
      type: string
      enum: [English, Spanish, French, German, Italian, Portuguese, Dutch, Polish, Turkish, Russian, Serbian, Croatian, Bosnian, Chinese, Japanese]
      default: English
    Summary:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
          description: The summary, in Markdown. The source text is never sent back.
        filename:
          type: string
          description: The file name, the title of the web page, or the names of several files.
        id:
          type: integer
          description: The saved document's id, only when `save=true` was asked for.
    SavedItem:
      type: object
      required: [id, title, summary, alreadySaved]
      properties:
        id:
          type: integer
          description: The id of the saved document.
        title:
          type: string
        summary:
          type: string
          description: The short summary, in Markdown.
        alreadySaved:
          type: boolean
    Meter:
      type: object
      properties:
        used:
          type: integer
        limit:
          type: integer
          description: 0 means unlimited.
    KeyInfo:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        prefix:
          type: string
          description: The first characters of the key, to tell keys apart.
          example: ink_AbCd
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        dailyLimit:
          type: [integer, "null"]
        usedToday:
          type: integer
        usedTotal:
          type: integer
    NamedText:
      type: object
      required: [text]
      properties:
        name:
          type: string
          maxLength: 200
        text:
          type: string
          maxLength: 300000
    FieldSpec:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 60
        description:
          type: string
          maxLength: 200
        type:
          type: string
          enum: [text, number, date, amount, list]
          default: text
    Change:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [added, removed, changed, moved]
        before:
          type: string
          description: The exact text of the older version (empty for an addition).
        after:
          type: string
          description: The exact text of the newer version (empty for a removal).
        beforePage:
          type: [integer, "null"]
        afterPage:
          type: [integer, "null"]
        segments:
          type:
            - array
            - "null"
          description: For a changed passage, the words that stayed (`eq`), went (`del`) and came (`ins`), in order.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
        numbers:
          type: object
          properties:
            removed:
              type: array
              items:
                type: string
            added:
              type: array
              items:
                type: string
        importance:
          type: string
          enum: [high, medium, low]
        summary:
          type: string
        impact:
          type: string
        explained:
          type: boolean
        suspicious:
          type: boolean
          description: The text reads like an instruction to an AI; the change is always `high`.
    Comparison:
      type: object
      properties:
        identical:
          type: boolean
        counts:
          type: object
          additionalProperties:
            type: integer
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
        bottomLine:
          type: string
        explained:
          type: boolean
        omitted:
          type: integer
        suspicious:
          type: boolean
    FieldResult:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        value:
          type: string
        quote:
          type: string
        page:
          type: [integer, "null"]
        found:
          type: boolean
        verified:
          type: boolean
        reason:
          type: string
    Extraction:
      type: object
      properties:
        name:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldResult"
        suspicious:
          type: boolean
    Error:
      type: object
      properties:
        error:
          type: string
          description: A message that is safe to show to a person.
        code:
          type: string
          description: A stable name for the reason, where there is one.
  headers:
    QuotaLimit:
      description: The key owner's daily limit of summaries.
      schema:
        type: integer
    QuotaRemaining:
      description: How many are left today (UTC).
      schema:
        type: integer
    RetryAfter:
      description: Seconds until the limit resets.
      schema:
        type: integer
  responses:
    Summary:
      description: The summary. With `stream=true`, a `text/event-stream` instead.
      headers:
        X-Quota-Limit:
          $ref: "#/components/headers/QuotaLimit"
        X-Quota-Remaining:
          $ref: "#/components/headers/QuotaRemaining"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Summary"
        text/event-stream:
          schema:
            type: string
    BadRequest:
      description: Something in the request is wrong; `error` says what.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidKey:
      description: 'The key is missing, wrong or revoked (`code: invalid_api_key`), or has expired (`code: api_key_expired`).'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: The text or file is too large.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unreadable:
      description: Nothing readable was found in the file or page, or it could not be opened.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OverLimit:
      description: |
        The owner's daily allowance is used up (`code: quota_exceeded`), the key's own daily limit is used up
        (`code: api_key_limit`), or calls are coming too fast. Wait for `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AiFailed:
      description: The language model failed. Not counted against the allowance; try again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Paused:
      description: |
        Inkling has reached its limit for AI work today (`code: daily_budget`) and is back after midnight UTC, or the AI
        service is busy. Not counted against the allowance.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
